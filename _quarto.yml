project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "blog/**/*.qmd"
  resources:
    - CNAME
    - files/

website:
  title: "Jiihn Ahn"
  site-url: "https://jiihn.org"
  description: "Personal website of Jiihn Ahn, PhD Student in New Testament."
  search:
    location: navbar
    type: overlay
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: publications.qmd
        text: Publications
      - href: presentations.qmd
        text: Presentations
      - href: blog/index.qmd
        text: Blog
      - href: cv.qmd
        text: CV
      - href: contact.qmd
        text: Contact
    right:
      # Language toggle (EN -> KO). The Korean site is a separate Quarto
      # project in ko/ with its own navbar; see ko/_quarto.yml.
      - text: "한국어"
        href: ko/index.html
      - icon: github
        href: "https://github.com/Jiihn-Ahn"
        aria-label: GitHub
      - icon: linkedin
        href: "https://www.linkedin.com/in/jiihn-ahn-a21371272/"
        aria-label: LinkedIn
      - icon: envelope
        href: "mailto:jiihn.ahn@ptsem.edu"
        aria-label: Email
  page-footer:
    border: true
    center: "© 2026 Jiihn Ahn · Built with [Quarto](https://quarto.org) · Inspired by [Cecilia Baldoni](https://cecibaldoni.github.io)"

format:
  html:
    theme: theme.scss
    toc: false
    grid:
      body-width: 880px
    link-external-newwindow: true
